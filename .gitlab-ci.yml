workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "frontend" || $CI_COMMIT_BRANCH == "backend")'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
      when: always
    - when: never

stages:
  - frontend
  - backend

variables:
  NODE_VERSION: "24"

frontend-ci:
  stage: frontend
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run build

backend-ci:
  stage: backend
  image: node:${NODE_VERSION}
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: credencia_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    NODE_ENV: test
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/credencia_test
    DIRECT_URL: postgresql://postgres:postgres@postgres:5432/credencia_test
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
  script:
    - npm ci
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run lint
    - npm run test:unit
    - npm run test:sec
    - npm run test:integration