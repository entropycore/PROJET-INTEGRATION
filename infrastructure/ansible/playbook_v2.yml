---
- name: Configuration de la VM Backend sur AWS
  hosts: all
  become: yes
  tasks:
    - name: Mettre à jour les paquets APT
      apt:
        update_cache: yes

    - name: Installer les dépendances Docker
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Ajouter la clé GPG officielle de Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Installer Docker et Docker Compose
      apt:
        name: 
          - docker-ce
          - docker-compose-plugin
        state: present

    - name: Créer le fichier SWAP (Vital pour t3.micro avec Keycloak)
      command: fallocate -l 4G /swapfile
      args:
        creates: /swapfile