name: CI pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend audit
        run: npm audit --audit-level=high 

      - name: Run frontend lint
        run: npm run lint

      - name: Prepare frontend reports directory
        run: mkdir -p reports

      - name: Run frontend unit tests 
        run: npm run test:ci

      - name: Build frontend app
        run: npm run build 

      - name: Build frontend Docker image
        run: docker build -t credencia-frontend .

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend/reports/frontend-vitest-junit.xml

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
      
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credencia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
    defaults:
      run:
        working-directory: backend
      
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/credencia_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/credencia_test
      CLIENT_URL: http://localhost:5173
      ACCESS_TOKEN_SECRET: ci_access_token_secret
      REFRESH_TOKEN_SECRET: ci_refresh_token_secret
      EMAIL_TOKEN_SECRET: ci_email_token_secret
      CSRF_SECRET: ci_csrf_secret
      HTTPS: "true"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
            
      - name: Install backend dependencies
        run: npm ci
      
      - name: Run backend audit
        run: npm audit --audit-level=high 

      - name: Generate Prisma client
        run: npx prisma generate
      
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      
      - name: Run backend unit tests 
        run: npm run test:unit
               
      - name: Run backend security tests
        run: npm run test:sec

      - name: Run backend integration tests
        run: npm run test:integration

      - name: Run backend coverage
        run: npm run test:coverage

      - name: Build backend Docker image
        run: docker build -t credencia-backend .

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
