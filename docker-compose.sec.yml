services:

  # =========================
  # KEYCLOAK
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:latest

    container_name: keycloak_sec

    restart: unless-stopped

    env_file:
      - .env.sec

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    command: start-dev

    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

    networks:
      - sec_net

  # =========================
  # SONARQUBE DATABASE
  # =========================
  sonarqube_db:
    image: postgres:15-alpine

    container_name: sonarqube_db

    restart: unless-stopped

    env_file:
      - .env.sec

    environment:
      POSTGRES_DB: ${SONAR_DB}
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}

    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

    networks:
      - sec_net

  # =========================
  # SONARQUBE
  # =========================
  sonarqube:
    image: sonarqube:community

    container_name: sonarqube_sec

    restart: unless-stopped

    depends_on:
      - sonarqube_db

    env_file:
      - .env.sec

    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/${SONAR_DB}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}

    ports:
      - "${SONAR_PORT:-9000}:9000"

    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

    networks:
      - sec_net

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  sec_net:
    driver: bridge