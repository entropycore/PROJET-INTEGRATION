

gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml;
gzip_min_length 1000;

server {
    listen 80;
    server_name _;

    # ── Headers sécurité HTTP (compatibles sans SSL) ──────────
    # Ces headers fonctionnent en HTTP ET HTTPS
    # Ils ne demandent PAS de certificat SSL
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # NE PAS ajouter Strict-Transport-Security ici
    # → c'est helmet qui le gère selon HTTPS=true/false

    # ── Frontend Vue.js ───────────────────────────────────────
    location / {
        proxy_pass http://frontend_web:80;
    
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── API Backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;
        proxy_read_timeout 90s;
    }

    # ── Keycloak SSO ──────────────────────────────────────────
    # Le frontend appelle /auth/... → nginx redirige vers Keycloak
    # Keycloak est sur le même réseau Docker (credencia_net)
    # accessible par son nom de container : keycloak_sec
    #location /auth/ {
    #    proxy_pass         http://keycloak_sec:8080/auth/;
    #    proxy_http_version 1.1;
    #    proxy_set_header   Host              $host;
    #    proxy_set_header   X-Real-IP         $remote_addr;
    #    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #    proxy_set_header   X-Forwarded-Proto $scheme;
    #    proxy_redirect     off;
    #    proxy_buffer_size  128k;
    #    proxy_buffers      4 256k;
    #    proxy_busy_buffers_size 256k;
    #}

    # ── Métriques Prometheus ──────────────────────────────────
    # Bloqué depuis l'extérieur : seul Prometheus (dans Docker)
    # peut accéder à /metrics du backend
    location /metrics {
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.1;
        deny   all;
        proxy_pass http://backend_api:3000/metrics;
    }
}