services:
  db:
    image: postgres:15-alpine
    container_name: prod_db
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - prod_net

  backend:
    image: eriie/image-backend:latest
    container_name: prod_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 3000
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-application/msword,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/gif,image/jpeg,image/png,image/webp,text/plain}
      S3_BUCKET: ${S3_BUCKET:-student-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      STORAGE_AUTO_CREATE_BUCKET: ${STORAGE_AUTO_CREATE_BUCKET:-false}
      STORAGE_BUCKET_PUBLIC_READ: ${STORAGE_BUCKET_PUBLIC_READ:-false}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    volumes:
      - backend_uploads:/app/uploads

    networks:
      - prod_net

  frontend:
    image: eriie/image-frontend:latest
    container_name: prod_frontend
    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env.prod

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - prod_net

volumes:
  postgres_prod_data:
  backend_uploads:

networks:
  prod_net:
    driver: bridge



