services:
  db:
    image: postgres:15-alpine
    container_name: prod_db
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - prod_net

  backend:
    image: eriie/image-backend:latest
    container_name: prod_backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 3000

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    networks:
      - prod_net

  frontend:
    image: eriie/image-frontend:latest
    container_name: prod_frontend
    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env.prod

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - prod_net

volumes:
  postgres_prod_data:

networks:
  prod_net:
    driver: bridge



