services:

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - credencia_net

  
  backend:
    image: credencia/credencia-backend:latest
    container_name: backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?schema=public
      PORT: 3000
      HTTPS: ${HTTPS:-false}
      
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node src/server.js"
    expose:
      - "3000"
    networks:
      - credencia_net

  
  frontend:
    image: credencia/credencia-frontend:latest
    container_name: frontend_web
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - credencia_net

  
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - credencia_net

volumes:
  postgres_data:

networks:
  credencia_net:
    external: true