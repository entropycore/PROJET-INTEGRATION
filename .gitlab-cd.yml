docker:build-push:
  stage: docker
  image: docker:27
  # This job uses the Docker socket mounted in the GitLab Runner:
  # /var/run/docker.sock:/var/run/docker.sock
  # It does not use Docker-in-Docker
  variables:
    FRONTEND_IMAGE_SHA: $DOCKERHUB_USERNAME/credencia-frontend:$CI_COMMIT_SHA
    BACKEND_IMAGE_SHA: $DOCKERHUB_USERNAME/credencia-backend:$CI_COMMIT_SHA
    FRONTEND_IMAGE_LATEST: $DOCKERHUB_USERNAME/credencia-frontend:dev-latest
    BACKEND_IMAGE_LATEST: $DOCKERHUB_USERNAME/credencia-backend:dev-latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never
  script:
    - docker version
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$FRONTEND_IMAGE_SHA" -t "$FRONTEND_IMAGE_LATEST" frontend
    - docker build -t "$BACKEND_IMAGE_SHA" -t "$BACKEND_IMAGE_LATEST" backend
    - docker push "$FRONTEND_IMAGE_SHA"
    - docker push "$BACKEND_IMAGE_SHA"
    - docker push "$FRONTEND_IMAGE_LATEST"
    - docker push "$BACKEND_IMAGE_LATEST"

deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - docker:build-push
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$STAGING_HOST"
    - test -n "$STAGING_USER"
    - test -n "$STAGING_SSH_PRIVATE_KEY"
    - test -n "$STAGING_PATH"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - |
      ssh "$STAGING_USER@$STAGING_HOST" "
        set -e
        cd '$STAGING_PATH'
        docker --version
        docker compose version
        echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin
        export FRONTEND_IMAGE='$DOCKERHUB_USERNAME/credencia-frontend:$CI_COMMIT_SHA'
        export BACKEND_IMAGE='$DOCKERHUB_USERNAME/credencia-backend:$CI_COMMIT_SHA'
        docker compose --env-file .env.staging -f docker-compose.prod.yml pull
        docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
      "

